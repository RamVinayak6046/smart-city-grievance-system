services:
  - type: web
    name: civicfix-pro
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: Dockerfile
    healthCheckPath: /index.php
    envVars:
      - key: APP_ENV
        value: production
      - key: DB_DRIVER
        value: sqlite
      - key: APP_URL
        value: https://civicfix-pro.onrender.com
